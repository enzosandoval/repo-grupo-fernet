<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuevo Producto</title>
<link rel="stylesheet"
	th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
<link rel="stylesheet"
	th:href="@{/webjars/fontawesome/css/font-awesome.min.css}">
<link rel="stylesheet" th:href="@{/css/footer.css}">
</head>
<body>
	<div th:replace="layout/navbar :: navbar"></div>
	<div class="container-fluid">
		<div class="row justify-content-center">
			<div class="col-md-8 formulario">
				<form th:action="@{/producto/guardar}" th:object="${producto}"
					method="POST" class="form_content">
					<h1>Nuevo Producto</h1>
					<br>
					<div class="form-group row">
						<label for="codigo" class="col-sm-2 col-form-label">Codigo</label>
						<div class="col-sm-10">
							<input type="number" class="form-control" id="codigo"
								placeholder="Codigo" th:field="*{codigo}" th:required="true">
						</div>
					</div>
					<div class="form-group row">
						<label for="nombreApellido" class="col-sm-2 col-form-label">Nombre</label>
						<div class="col-sm-10">
							<input type="text" class="form-control" id="nombre"
								placeholder="Nombre" th:field="*{nombre}" th:required="true">
						</div>
					</div>
					<div class="form-group row">
						<label for="precio" class="col-sm-2 col-form-label">Precio</label>
						<div class="col-sm-10">
							<input type="number" class="form-control" id="precio"
								placeholder="Precio" th:field="*{precio}" th:required="true"
								step="any">
						</div>
					</div>
					<div class="form-group row">
						<label for="marca" class="col-sm-2 col-form-label">Marca</label>
						<div class="col-sm-10">
							<input type="text" class="form-control" id="marca"
								placeholder="Marca" th:field="*{marca}" th:required="true">
						</div>
					</div>
					<div class="form-group row">
						<label for="stock" class="col-sm-2 col-form-label">Stock</label>
						<div class="col-sm-10">
							<input type="number" class="form-control" id="stock"
								placeholder="Stock" th:field="*{stock}" th:required="true">
						</div>
					</div>
					<div class="form-group row">
						<div class="col-sm-12">
							<button type="submit" class="btn btn-primary form_button">Guardar</button>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
	<div th:replace="layout/footer :: footer"></div>
</body>
<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script th:src="@{/webjars/popper.js/umd/popper.min.js}"></script>
<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</html>
