<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<title>Compra</title>
<link rel="stylesheet"
	th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/css/styles.css}">
<link rel="stylesheet" th:href="@{/css/forms.css}">
<link rel="stylesheet" th:href="@{/css/footer.css}">
</head>
<body>
	<div th:replace="layout/navbar.html :: navbar"></div>
	<div class="container">
		<div class="row justify-content-center my-5 shadow p-3 bg-white rounded">
			<div class="col-md-6 mb-4 mb-md-0">
				<div id="mdb-lightbox-ui"></div>
				<div class="mdb-lightbox">
					<div class="row product-gallery mx-1">
						<div class="col-12 mb-0">
							<figure class="view overlay rounded z-depth-1 main-img">
								<a> <img
									th:src="*{'data:image/png;base64,'+compra.producto.image}"
									class="img-fluid" alt="Responsive image" />
								</a>
							</figure>
						</div>
					</div>
				</div>
			</div>
			<div class="col-md-6">
				<form target="_blank" action="https://website.com/action.php"
					method="POST">
					<h1 class="compra__titulo">
						<span th:text="${compra.producto.nombre}"></span>
					</h1>
					<p class="mb-2 text-muted text-uppercase small"
						th:text="${compra.producto.marca}"></p>
					<p class="mb-2 text-muted small"
						th:text="'Codigo: ' + ${compra.producto.codigo}"></p>
					<div class="table-responsive">
						<table class="table table-sm table-borderless mb-0">
							<tbody>
								<tr>
									<th class="pl-0 w-25" scope="row"><strong>Descripción:
									</strong></th>
									<td><span th:text="${compra.producto.descripcion}"></span></td>
								</tr>
								<tr>
									<th class="pl-0 w-25" scope="row"><strong>Precio:
											$</strong></th>
									<td><span th:text="${compra.producto.precio}"></span></td>
								</tr>
								<tr>
									<th class="pl-0 w-25" scope="row"><strong>Delivery:
									</strong></th>
									<td>USA, Europe</td>
								</tr>
							</tbody>
						</table>
					</div>
					<div class="table-responsive mb-2">
						<table class="table table-sm table-borderless">
							<tbody>
								<tr>
									<td class="pl-0 w-25" scope="row"><strong>Cantidad
									</strong></td>
								</tr>
								<tr>
									<td><select>
											<option
												th:each="i : ${#numbers.sequence(1, compra.producto.stock)}"
												th:value="${i}" th:text="${i}">Disponibles</option>
									</select> <span th:text="${compra.producto.stock} + ' Disponibles'"></span></td>
								</tr>
							</tbody>
						</table>
					</div>
					<button type="submit" class="btn btn-primary btn-md mr-1 mb-2">Comprar
						Ahora</button>
					<button type="submit" class="btn btn-light btn-md mr-1 mb-2">
						<i class="fas fa-shopping-cart pr-2"></i>Agragar al carrito
					</button>
				</form>
			</div>
		</div>
	</div>
	<div th:replace="layout/footer :: footer"></div>
</body>
<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script th:src="@{/webjars/popper.js/umd/popper.min.js}"></script>
<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</html>
